name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'phase2/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_TARGET: capacitor
          NEXT_PUBLIC_CORE_API_URL: https://example.invalid
